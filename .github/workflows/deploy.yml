# Deploy
#
# 在「Verify and Publish」成功把多架构镜像推送到 GHCR 之后，
# 通过 SSH 登录目标服务器，直接 `docker run` 拉取新镜像并重启容器。
# 也可在 Actions 页面手动触发重新部署。
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置（仅三个）：
#   DEPLOY_HOST      服务器 IP 或域名
#   DEPLOY_USER      SSH 登录用户名
#   DEPLOY_PASSWORD  SSH 登录密码
#
# 以下为非敏感配置，直接改本文件 env 即可：
#   DEPLOY_PATH  服务器上存放 data/ 与 config.json 的目录（见下方 env）
#   APP_PORT     容器对外端口（容器内固定 80），默认 3000
#   DEPLOY_PORT  SSH 端口，默认 22
#
# 服务器需具备：SSH 用户有 docker 权限；首次部署会在 DEPLOY_PATH 下自动创建
# data/ 与空的 config.json（auth-key 写进 config.json 的 "auth-key" 字段）。

name: Deploy

on:
  # 镜像发布成功后自动部署
  workflow_run:
    workflows: ["Verify and Publish"]
    types: [completed]

  # 手动重新部署（可指定镜像 tag，默认 latest）
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像 tag，例如 3.2.2 或 latest"
        required: false
        default: "latest"

permissions:
  contents: read

env:
  IMAGE_NAME: chatgpt2api
  DEPLOY_PATH: /opt/chatgpt2api   # 服务器上存放 data/ 与 config.json 的目录
  APP_PORT: "3000"                # 容器对外端口（容器内固定 80）
  DEPLOY_PORT: "22"               # SSH 端口

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run 触发时，仅当上游成功且是 main 或 v* tag；手动触发时始终执行
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))

    steps:
      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.event.workflow_run.head_branch }}"
            if [ "$branch" = "main" ]; then
              # main push 对应 docker-publish 打的 latest 标签
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            else
              # head_branch 形如 v3.2.2，去掉前缀 v 得到 3.2.2，
              # 与 docker-publish.yml 中 metadata-action 的 semver 标签一致
              echo "tag=${branch#v}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="${{ env.DEPLOY_PATH }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

            # 首次部署准备 data 目录与 config.json
            mkdir -p "${APP_DIR}/data"
            if [ ! -f "${APP_DIR}/config.json" ]; then
              echo '{}' > "${APP_DIR}/config.json"
            fi

            echo ">> Pulling ${IMAGE}"
            docker pull "${IMAGE}"

            echo ">> Stopping old container"
            docker stop chatgpt2api 2>/dev/null || true
            docker rm chatgpt2api 2>/dev/null || true

            echo ">> Starting container"
            docker run -d \
              --name chatgpt2api \
              --restart unless-stopped \
              -p "${{ env.APP_PORT }}:80" \
              -v "${APP_DIR}/data:/app/data" \
              -v "${APP_DIR}/config.json:/app/config.json" \
              "${IMAGE}"

            echo ">> Pruning dangling images"
            docker image prune -f
