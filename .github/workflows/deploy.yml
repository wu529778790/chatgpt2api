# Deploy
#
# 在「Verify and Publish」成功把镜像推送到 GHCR 之后，
# 通过 SSH 登录目标服务器，用 `sudo docker run` 拉取 latest 镜像并重启容器。
# 也可在 Actions 页面手动触发重新部署。
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置（仅三个）：
#   DEPLOY_HOST      服务器 IP 或域名
#   DEPLOY_USER      SSH 登录用户名（需具备免密 sudo 执行 docker 的权限）
#   DEPLOY_PASSWORD  SSH 登录密码
#
# 以下为非敏感配置，直接改本文件 env 即可：
#   APP_PORT   容器对外端口（容器内固定 80），默认 6703
#   ENV_FILE   服务器上的 .env 路径（含 CHATGPT2API_AUTH_KEY / DATABASE_URL 等）
#   DEPLOY_PORT SSH 端口，默认 22

name: Deploy

on:
  # 镜像发布成功后自动部署
  workflow_run:
    workflows: ["Verify and Publish"]
    types: [completed]

  # 手动重新部署
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: chatgpt2api
  APP_PORT: "6703"
  APP_DIR: /opt/1panel/apps/openresty/openresty/www/sites/api.shenzjd.com/index
  ENV_FILE: /opt/1panel/apps/openresty/openresty/www/sites/api.shenzjd.com/index/.env
  DEPLOY_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run 触发时，仅当上游成功且是 main 或 v* tag；手动触发时始终执行
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER="${{ env.IMAGE_NAME }}"
            ENV_FILE="${{ env.ENV_FILE }}"
            APP_DIR="${{ env.APP_DIR }}"
            DATA_DIR="${{ env.APP_DIR }}/data"

            # 首次部署准备数据目录与 config.json（SQLite 库 / 图片 / 设置持久化）
            sudo mkdir -p "${DATA_DIR}"
            if [ ! -f "${APP_DIR}/config.json" ]; then
              echo '{}' | sudo tee "${APP_DIR}/config.json" >/dev/null
            fi

            echo ">> Pulling ${IMAGE}"
            sudo docker pull "${IMAGE}"

            echo ">> Stopping old container"
            sudo docker stop "${CONTAINER}" 2>/dev/null || true
            sudo docker rm "${CONTAINER}" 2>/dev/null || true

            ENV_FLAGS=""
            if [ -f "${ENV_FILE}" ]; then
              ENV_FLAGS="--env-file ${ENV_FILE}"
            else
              echo ">> WARN: ${ENV_FILE} not found, running without env file"
            fi

            echo ">> Starting container"
            sudo docker run -d \
              --name "${CONTAINER}" \
              --restart unless-stopped \
              ${ENV_FLAGS} \
              -p "${{ env.APP_PORT }}:80" \
              -v "${DATA_DIR}:/app/data" \
              -v "${APP_DIR}/config.json:/app/config.json" \
              "${IMAGE}"

            echo ">> Pruning dangling images"
            sudo docker image prune -f
